[build]
  command = "npm run build"
  publish = "dist"

# Un commit nuevo obliga a recompilar. Si solo cambian variables VITE_*,
# en Deploys usá "Retry without cache with latest branch commit".
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
